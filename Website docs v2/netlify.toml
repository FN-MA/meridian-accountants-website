# Netlify build settings (used when the site's base directory is "Website docs v2").
[build]
  command = "npm run build"
  publish = "dist"
    ignore = "exit 1"

       [[redirects]]
     from = "https://meridian-accountants.netlify.app/*"
     to = "https://meridian-accountants.com/:splat"
     status = 301
     force = true
